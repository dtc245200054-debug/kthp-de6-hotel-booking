# ==============================================================================
# GRAFANA PROMTAIL CONFIGURATION - PROMTAIL 3.X
# Hệ thống Đặt phòng Khách sạn - Aurora Grand Resort & Spa (KTHP Đề 6)
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # 1. Thu thập Nginx Access Log (Label job: nginx)
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx-proxy
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            service: service
            status: status
            client_ip: client_ip
            request_method: request_method
            request_uri: request_uri
            request_time: request_time
      - labels:
          status:
          request_method:
          service:

  # 2. Thu thập Nginx Error Log (Label job: nginx-error)
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          service: nginx-proxy
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<message>.*)'
      - labels:
          level:

  # 3. Thu thập Backend Application Log (Label job: backend)
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: hotel-backend
          __path__: /var/log/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            method: method
            status: status
      - labels:
          level:
          status:
          method:

  # 4. Thu thập Docker Containers Log
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*'
          source: filename
      - labels:
          stream:
          container_id:
