# ==============================================================================
# NGINX REVERSE PROXY & SECURITY HARDENING CONFIGURATION
# Hệ thống Đặt phòng Khách sạn - Aurora Grand Resort & Spa (KTHP Đề 6)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log JSON có cấu trúc tối ưu cho Promtail & Grafana Loki
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"service":"nginx-proxy",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # Tối ưu hóa truyền tải tệp và ẩn thông tin phiên bản (Security Hardening)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Giới hạn kích thước request body ngăn chặn tấn công DoS / tràn bộ đệm
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream định tuyến
    upstream frontend_upstream {
        server frontend:80;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:5000;
        keepalive 32;
    }

    # ==========================================================================
    # 1. CỔNG 80: HTTP REVERSE PROXY
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Tiêu đề an ninh bảo mật (Security Headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com; connect-src 'self';" always;

        # Định tuyến API đến Backend Express (Hạn chế phương thức HTTP không cần thiết)
        location /api/ {
            limit_except GET POST PUT DELETE OPTIONS {
                deny all;
            }
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Định tuyến Healthcheck
        location /health {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Định tuyến Prometheus metrics backend
        location /metrics {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://backend_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Định tuyến Frontend SPA
        location / {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Trang lỗi thân thiện
        error_page 502 503 504 /custom_50x.html;
        location = /custom_50x.html {
            internal;
            return 503 '{"error": true, "message": "Dịch vụ khách sạn đang khởi động lại hoặc nâng cấp hệ thống. Vui lòng thử lại sau giây lát."}';
            add_header Content-Type application/json always;
        }
    }

    # ==========================================================================
    # 2. CỔNG 443: HTTPS REVERSE PROXY VỚI SSL/TLS VÀ HSTS
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # Cấu hình chứng chỉ SSL/TLS
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers & HSTS (Strict-Transport-Security chỉ bật khi có HTTPS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com; connect-src 'self';" always;

        location /api/ {
            limit_except GET POST PUT DELETE OPTIONS {
                deny all;
            }
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /health {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /metrics {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://backend_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location / {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        error_page 502 503 504 /custom_50x.html;
        location = /custom_50x.html {
            internal;
            return 503 '{"error": true, "message": "Dịch vụ khách sạn đang khởi động lại hoặc nâng cấp hệ thống. Vui lòng thử lại sau giây lát."}';
            add_header Content-Type application/json always;
        }
    }

    # ==========================================================================
    # 3. CỔNG 8080: NGINX STUB_STATUS DÀNH CHO NGINX PROMETHEUS EXPORTER
    # ==========================================================================
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            return 404;
        }
    }
}
